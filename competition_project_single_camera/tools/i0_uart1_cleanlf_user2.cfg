# Static-only I0 USER2 configuration identity. Do not launch OpenOCD from this file
# without a separately approved board window.
set _ENDIAN little
set _CHIPNAME i0_uart1_cleanlf
set CPUTAPID 0x006A0A79
set I0_TITANIUM_USER2_OUTER_IR 0x09
set I0_BSCAN_TUNNEL_TYPE 6
set I0_BSCAN_TUNNEL_USER 1
set I0_BSCAN_TUNNEL_IR_WIDTH 8
set I0_RAM_WORK_AREA 0xF9000000
set I0_RAM_WORK_SIZE 1024

# Efinity 2025.2 evidence: efx_dbg/jtag.py maps Titanium USER2 to five-bit
# 01001 (0x09), and its shared JTAG API writes that IR. This OpenOCD file does
# not itself invoke that vendor API, so I0_USER2_SELECTION_CHAIN remains BLOCKED.
# Ti375C529 Hard SoC debug_ti.cfg supplies tunnel 6 1 and IR width 8.
jtag newtap $_CHIPNAME bridge -expected-id $CPUTAPID -irlen 5 -ircapture 0x5 -irmask 0xF
target create $_CHIPNAME.cpu0 riscv -endian $_ENDIAN -chain-position $_CHIPNAME.bridge -coreid 0 -dbgbase 0x10B80000 -work-area-phys $I0_RAM_WORK_AREA -work-area-size $I0_RAM_WORK_SIZE
riscv use_bscan_tunnel $I0_BSCAN_TUNNEL_TYPE $I0_BSCAN_TUNNEL_USER
riscv set_bscan_tunnel_ir $I0_BSCAN_TUNNEL_IR_WIDTH
riscv resume_order reversed

echo "I0_USER2_SELECTION_CHAIN=Titanium_USER2_01001_outer_ir_0x09_to_bscan_6_1_ir_width_8"
init
halt
