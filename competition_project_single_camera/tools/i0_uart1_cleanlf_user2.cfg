# Static-only I0 USER2 configuration identity. Do not launch OpenOCD from this file
# without a separately approved board window.
set _ENDIAN little
set _CHIPNAME i0_uart1_cleanlf
# TJ375N529 outer FPGA TAP ID. The Efinity FTDI template's 0x006A0A79
# default is Ti375 and must not be inherited by this fixed TJ375 target cfg.
set CPUTAPID 0x006A0EF3
set I0_RAM_WORK_AREA 0xF9000000
set I0_RAM_WORK_SIZE 1024

# OpenOCD consumes these literal RISC-V target arguments when this file is
# passed after the approved FTDI interface file. Static argument flow is not a
# USER2 board PASS; a separately approved window must preserve the exact files.
jtag newtap $_CHIPNAME bridge -expected-id $CPUTAPID -irlen 5 -ircapture 0x5 -irmask 0xF
target create $_CHIPNAME.cpu0 riscv -endian $_ENDIAN -chain-position $_CHIPNAME.bridge -coreid 0 -dbgbase 0x10B80000 -work-area-phys $I0_RAM_WORK_AREA -work-area-size $I0_RAM_WORK_SIZE
riscv use_bscan_tunnel 6 1
riscv set_bscan_tunnel_ir 0x09
riscv resume_order reversed

echo "I0_OPENOCD_ARGUMENT_FLOW=bscan_width_6_type_1_outer_ir_0x09"
init
halt
