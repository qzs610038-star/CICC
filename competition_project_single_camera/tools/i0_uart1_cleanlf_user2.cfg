# I0 UART1 clean-LF USER2 RAM-only OpenOCD target.
#
# This file is intentionally independent of every G1/R0/M2 UART0 card,
# staging script, approval JSON, COM assignment, and generated outflow.
# It is not an autonomous command: a new approved hardware window is required
# before OpenOCD may be launched with it.

set _ENDIAN little
set _CHIPNAME i0_uart1_cleanlf

# Board-level FPGA JTAG ID, checked separately by the volatile programmer step.
set I0_EXPECTED_FPGA_JTAG_ID 0x006A0EF3

# CPU debug TAP ID from Efinity 2025.2 Ti375C529 Hard SoC debug_ti.cfg.
set CPUTAPID 0x006A0A79

# Titanium has a five-bit outer IR. Efinity jtag.py defines USER2 as 01001.
set I0_USER2_OUTER_IR 0x09

# Efinity Hard SoC debug_ti.cfg programs these USER2 BSCAN tunnel parameters.
set I0_BSCAN_TUNNEL_TYPE 6
set I0_BSCAN_TUNNEL_USER 1
set I0_BSCAN_TUNNEL_IR 8

# Same-batch Hello linker/readelf evidence constrains all valid RAM PCs.
set I0_RAM_START 0xF9000000
set I0_RAM_END 0xF9003FFF

jtag newtap $_CHIPNAME bridge -expected-id $CPUTAPID -irlen 5 -ircapture 0x5 -irmask 0xF
target create $_CHIPNAME.cpu0 riscv -endian $_ENDIAN -chain-position $_CHIPNAME.bridge -coreid 0 -dbgbase 0x10B80000 -work-area-phys $I0_RAM_START -work-area-size 1024
riscv use_bscan_tunnel $I0_BSCAN_TUNNEL_TYPE $I0_BSCAN_TUNNEL_USER
riscv set_bscan_tunnel_ir $I0_BSCAN_TUNNEL_IR
riscv resume_order reversed

# The only permitted initial CPU state is halted. This file does not load an
# ELF, resume, access APB, configure Flash/SPI/PROM/DDR, or select USER1.
init
halt
